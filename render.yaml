databases:
  - name: sahal_db
    databaseName: sahal_sports
    plan: free
    region: frankfurt

services:
  - type: web
    name: sahal-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate && (npm run create-admin || true) && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: FCM_TOPIC_PREFIX
        value: sahal
      - key: PROVIDER_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sahal_db
          property: connectionString
